<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Discord - Exposición</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    display: flex;
    height: 100vh;
    background-color: #313338;
    color: #dcddde;
    overflow: hidden;
  }

  /* ===== BARRA DE SERVIDORES ===== */
  .servers {
    width: 72px;
    background-color: #1e1f22;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 8px;
  }

  .server-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    color: white;
    cursor: pointer;
    transition: border-radius 0.2s, background-color 0.2s;
    position: relative;
  }

  .server-icon:hover {
    border-radius: 16px;
  }

  .server-icon.active {
    border-radius: 16px;
  }

  .server-icon.active::before {
    content: "";
    position: absolute;
    left: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 24px;
    background-color: white;
    border-radius: 0 4px 4px 0;
  }

  .server-icon[data-server="0"] { background-color: #5865f2; }
  .server-icon[data-server="1"] { background-color: #23a55a; }
  .server-icon[data-server="2"] { background-color: #f23f43; }

  /* ===== LISTA DE CANALES ===== */
  .channels {
    width: 240px;
    background-color: #2b2d31;
    display: flex;
    flex-direction: column;
    padding: 12px 0;
  }

  .server-name {
    padding: 8px 16px;
    font-weight: bold;
    font-size: 15px;
    color: #f2f3f5;
    border-bottom: 1px solid #1e1f22;
    margin-bottom: 8px;
  }

  .category {
    padding: 8px 16px;
    font-size: 11px;
    text-transform: uppercase;
    color: #949ba4;
    font-weight: bold;
    letter-spacing: 0.02em;
  }

  .channel {
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: #949ba4;
    font-size: 14px;
  }

  .channel:hover {
    background-color: #35373c;
    color: #dcddde;
  }

  .channel.active {
    background-color: #404249;
    color: #f2f3f5;
  }

  .channel::before {
    content: "#";
    font-weight: bold;
    color: #949ba4;
  }

  /* ===== CHAT PRINCIPAL ===== */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: #313338;
    min-width: 0;
  }

  .chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid #1e1f22;
    font-weight: bold;
    font-size: 15px;
    color: #f2f3f5;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chat-header::before {
    content: "#";
    color: #949ba4;
    font-size: 20px;
  }

  .messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
  }

  .message-content {
    flex: 1;
  }

  .message-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .username {
    font-weight: bold;
    color: #f2f3f5;
    font-size: 15px;
  }

  .timestamp {
    font-size: 11px;
    color: #949ba4;
  }

  .message-text {
    font-size: 14px;
    line-height: 1.5;
    color: #dcddde;
  }

  .message-text strong {
    color: #f2f3f5;
  }

  .message-text .highlight {
    background-color: #5865f2;
    color: white;
    padding: 1px 4px;
    border-radius: 3px;
    font-weight: bold;
  }

  .message-text ul {
    margin-top: 8px;
    margin-left: 20px;
  }

  .message-text li {
    margin-bottom: 4px;
  }

  /* ===== BARRA DE MENSAJES ===== */
  .message-bar {
    padding: 0 16px 16px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .message-bar .plus {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #5865f2;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.2s, transform 0.15s;
  }

  .message-bar .plus:hover {
    background-color: #4752c4;
  }

  .message-bar .input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    background-color: #383a40;
    border-radius: 8px;
    padding: 0 12px;
    gap: 8px;
    height: 44px;
  }

  .message-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #dcddde;
    font-size: 14px;
    height: 100%;
  }

  .message-bar input::placeholder {
    color: #6d6f78;
  }

  .message-bar .icon-btn {
    background: transparent;
    border: none;
    color: #b5bac1;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }

  .message-bar .icon-btn:hover {
    color: #dcddde;
  }

  /* ===== PANEL DE MIEMBROS ===== */
  .members {
    width: 220px;
    background-color: #2b2d31;
    padding: 16px 8px;
    overflow-y: auto;
  }

  .member-category {
    font-size: 11px;
    text-transform: uppercase;
    color: #949ba4;
    font-weight: bold;
    padding: 8px;
    letter-spacing: 0.02em;
  }

  .member {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    color: #949ba4;
  }

  .member:hover {
    background-color: #35373c;
    color: #dcddde;
  }

  .member .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #23a55a;
  }

  .member-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
    font-size: 12px;
  }

  /* Scrollbar estilo Discord */
  ::-webkit-scrollbar {
    width: 8px;
  }

  ::-webkit-scrollbar-track {
    background: #2b2d31;
  }

  ::-webkit-scrollbar-thumb {
    background: #1a1b1e;
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #111214;
  }

  /* ===== INDICADOR DE ESCRIBIENDO ===== */
  .typing-indicator {
    display: none;
    padding: 8px 16px;
    font-size: 12px;
    color: #949ba4;
    font-style: italic;
  }

  .typing-indicator.active {
    display: block;
  }

  /* ===== ESTEROIDES PARA MÓVIL ===== */
  @media (max-width: 768px) {
    body {
      flex-direction: column;
      overflow: hidden;
    }

    .servers {
      width: 100%;
      height: 56px;
      flex-direction: row;
      justify-content: space-around;
      padding: 4px 0;
      order: 0;
      flex-shrink: 0;
    }

    .server-icon {
      width: 40px;
      height: 40px;
      font-size: 14px;
    }

    .server-icon.active::before {
      display: none;
    }

    .channels {
      width: 100%;
      height: auto;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      order: 1;
      flex-shrink: 0;
    }

    .channels.open {
      max-height: 300px;
      overflow-y: auto;
    }

    .server-name {
      display: none;
    }

    .category {
      padding: 4px 16px;
      font-size: 10px;
    }

    .channel {
      padding: 8px 16px;
      font-size: 13px;
    }

    .chat {
      flex: 1;
      order: 2;
      min-height: 0;
    }

    .chat-header {
      padding: 10px 12px;
      font-size: 14px;
    }

    .messages {
      padding: 12px;
      gap: 12px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      font-size: 13px;
    }

    .username {
      font-size: 13px;
    }

    .message-text {
      font-size: 13px;
    }

    .message-bar {
      padding: 0 8px 8px 8px;
      gap: 6px;
    }

    .message-bar .plus {
      width: 36px;
      height: 36px;
      font-size: 18px;
    }

    .message-bar .input-wrapper {
      height: 38px;
      padding: 0 8px;
    }

    .message-bar input {
      font-size: 13px;
    }

    .members {
      display: none;
    }

    .menu-toggle {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      color: #dcddde;
      font-size: 20px;
      cursor: pointer;
    }
  }

  .menu-toggle {
    display: none;
  }

  @supports (padding: max(0px)) {
    .message-bar {
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

  <!-- BARRA DE SERVIDORES -->
  <div class="servers">
    <div class="server-icon active" data-server="0" onclick="cambiarServidor(0)">E</div>
    <div class="server-icon" data-server="1" onclick="cambiarServidor(1)">D</div>
    <div class="server-icon" data-server="2" onclick="cambiarServidor(2)">C</div>
  </div>

  <!-- LISTA DE CANALES -->
  <div class="channels">
    <div class="server-name" id="server-name">Historia</div>
    <div class="category">Canales</div>
    <div id="lista-canales"></div>
  </div>

  <!-- CHAT PRINCIPAL -->
  <div class="chat">
    <div class="chat-header" id="chat-header">#creadores</div>
    <div class="messages" id="mensajes"></div>

    <!-- BARRA DE MENSAJES -->
    <div class="message-bar">
      <div class="plus" title="Adjuntar (adorno)">+</div>
      <div class="input-wrapper">
        <input type="text" id="bloc-notas" placeholder="Escribe aquí tus notas..." />
        <button class="icon-btn" title="Enviar audio (adorno)">🎤</button>
      </div>
    </div>
  </div>

  <!-- PANEL DE MIEMBROS -->
  <div class="members">
    <div class="member-category">En línea — 5</div>
    <div class="member">
      <div class="member-avatar" style="background-color: #5865f2;">D</div>
      <div class="dot"></div>
      <span>Discord</span>
    </div>
    <div class="member">
      <div class="member-avatar" style="background-color: #f23f43;">J</div>
      <div class="dot"></div>
      <span>Jason Citron</span>
    </div>
    <div class="member">
      <div class="member-avatar" style="background-color: #23a55a;">S</div>
      <div class="dot"></div>
      <span>Stanislav</span>
    </div>
    <div class="member">
      <div class="member-avatar" style="background-color: #f0b232;">P</div>
      <div class="dot"></div>
      <span>Plataforma</span>
    </div>
    <div class="member">
      <div class="member-avatar" style="background-color: #eb459e;">A</div>
      <div class="dot"></div>
      <span>Actualidad</span>
    </div>
  </div>

<script>
  // ===== DATOS DE LA EXPOSICIÓN =====
  const servidores = [
    {
      nombre: "Historia",
      canales: [
        {
          nombre: "creadores",
          mensajes: [
            {
              usuario: "Discord",
              avatar: "D",
              color: "#5865f2",
              hora: "10:00",
              texto: "¡Bienvenidos a la exposición sobre <span class='highlight'>DISCORD</span>! 🎮 Hoy hablaremos de sus creadores, origen, plataforma, pros y contras, demandas legales y su comunidad actual."
            },
            {
              usuario: "Jason Citron",
              avatar: "J",
              color: "#f23f43",
              hora: "10:01",
              texto: "Hola, soy uno de los creadores. Fundé Discord en <strong>2015</strong> junto a <strong>Stanislav Vishnevskiy</strong>. Antes había creado OpenFeint y el estudio Hammer & Chisel."
            },
            {
              usuario: "Stanislav Vishnevskiy",
              avatar: "S",
              color: "#23a55a",
              hora: "10:02",
              texto: "Exacto. La idea nació porque los gamers necesitaban una herramienta de comunicación estable y de baja latencia. Así que pivotamos de hacer videojuegos a crear la plataforma."
            }
          ]
        },
        {
          nombre: "origen",
          mensajes: [
            {
              usuario: "Historia",
              avatar: "H",
              color: "#f0b232",
              hora: "10:03",
              texto: "<strong>Fecha de lanzamiento:</strong> 6 de marzo de 2015.<br><br><strong>Propósito original:</strong> Ser una aplicación de VoIP gratuita diseñada para comunidades de videojuegos. Una alternativa a TeamSpeak o Skype."
            },
            {
              usuario: "Crecimiento",
              avatar: "C",
              color: "#5865f2",
              hora: "10:04",
              texto: "<strong>2015:</strong> Lanzamiento con muy pocos usuarios.<br><strong>2020:</strong> Explosión por la pandemia.<br><strong>2021:</strong> Más de 150 millones de usuarios activos mensuales.<br><strong>Actualidad:</strong> Más de 90 millones de usuarios activos diarios."
            }
          ]
        }
      ]
    },
    {
      nombre: "Plataforma",
      canales: [
        {
          nombre: "dispositivos",
          mensajes: [
            {
              usuario: "Plataforma",
              avatar: "P",
              color: "#5865f2",
              hora: "10:05",
              texto: "Discord está disponible en:<br><br>💻 <strong>Windows</strong><br>🍎 <strong>macOS</strong><br>🐧 <strong>Linux</strong><br>📱 <strong>Android</strong><br>📱 <strong>iOS</strong><br>🌐 <strong>Navegador web</strong>"
            }
          ]
        },
        {
          nombre: "pros-contras",
          mensajes: [
            {
              usuario: "Pros",
              avatar: "+",
              color: "#23a55a",
              hora: "10:06",
              texto: "<strong>PROS:</strong><br>✅ Gratuito en su versión básica<br>✅ Excelente calidad de audio y video<br>✅ Organización por servidores y canales<br>✅ Bots y automatización<br>✅ Multiplataforma<br>✅ Compartir pantalla y transmisión en vivo"
            },
            {
              usuario: "Contras",
              avatar: "-",
              color: "#f23f43",
              hora: "10:07",
              texto: "<strong>CONTRAS:</strong><br>❌ Moderación insuficiente en servidores públicos<br>❌ Funciones clave detrás de pago (Nitro)<br>❌ Interfaz abrumadora para nuevos usuarios<br>❌ Sin cifrado de extremo a extremo por defecto<br>❌ Consumo de recursos en equipos modestos"
            }
          ]
        }
      ]
    },
    {
      nombre: "Actualidad",
      canales: [
        {
          nombre: "demandas",
          mensajes: [
            {
              usuario: "Demandas Legales",
              avatar: "!",
              color: "#f23f43",
              hora: "10:08",
              texto: "<strong>Brasil (2026):</strong> Demanda de casi 100 millones USD por fallas de moderación tras el suicidio de una adolescente.<br><br><strong>Texas (EE.UU.):</strong> Investigación por contenidos extremistas entre menores.<br><br><strong>Rusia y Turquía:</strong> Bloqueos temporales del servicio."
            }
          ]
        },
        {
          nombre: "comunidad",
          mensajes: [
            {
              usuario: "Comunidad",
              avatar: "C",
              color: "#eb459e",
              hora: "10:09",
              texto: "Hoy Discord es mucho más que una app para gamers:<br><br>🎓 Grupos de estudio<br>💼 Equipos de trabajo<br>🎨 Comunidades de arte<br>🎵 Música y podcasts<br>🌍 Comunidades de todo el mundo<br><br>Más de <strong>90 millones de usuarios activos diarios</strong>."
            },
            {
              usuario: "Discord",
              avatar: "D",
              color: "#5865f2",
              hora: "10:10",
              texto: "En conclusión, Discord es una herramienta poderosa que nació para gamers pero se expandió a todo el mundo. Como toda red social, depende del uso que le demos. ¡Gracias por su atención! 🎮🔥"
            }
          ]
        }
      ]
    }
  ];

  let servidorActual = 0;

  // ===== FUNCIONES PRINCIPALES =====
  function cambiarServidor(index) {
    servidorActual = index;

    document.querySelectorAll('.server-icon').forEach((icon, i) => {
      icon.classList.toggle('active', i === index);
    });

    document.getElementById('server-name').textContent = servidores[index].nombre;

    const listaCanales = document.getElementById('lista-canales');
    listaCanales.innerHTML = '';
    servidores[index].canales.forEach((canal, i) => {
      const div = document.createElement('div');
      div.className = 'channel' + (i === 0 ? ' active' : '');
      div.textContent = canal.nombre;
      div.onclick = () => cambiarCanal(i);
      listaCanales.appendChild(div);
    });

    cambiarCanal(0);
  }

  function cambiarCanal(index) {
    document.querySelectorAll('.channel').forEach((ch, i) => {
      ch.classList.toggle('active', i === index);
    });

    document.getElementById('chat-header').textContent = '#' + servidores[servidorActual].canales[index].nombre;

    const mensajesDiv = document.getElementById('mensajes');
    mensajesDiv.innerHTML = '';

    servidores[servidorActual].canales[index].mensajes.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <div class="avatar" style="background-color: ${msg.color};">${msg.avatar}</div>
        <div class="message-content">
          <div class="message-header">
            <span class="username">${msg.usuario}</span>
            <span class="timestamp">Hoy a las ${msg.hora}</span>
          </div>
          <div class="message-text">${msg.texto}</div>
        </div>
      `;
      mensajesDiv.appendChild(div);
    });

    setTimeout(scrollToBottom, 50);
  }

  function scrollToBottom() {
    const messages = document.querySelector('.messages');
    messages.scrollTop = messages.scrollHeight;
  }

  // ===== DETECCIÓN MÓVIL =====
  const isMobile = window.matchMedia('(max-width: 768px)').matches;

  if (isMobile) {
    const chatHeader = document.querySelector('.chat-header');
    const menuBtn = document.createElement('button');
    menuBtn.className = 'menu-toggle';
    menuBtn.innerHTML = '☰';
    menuBtn.onclick = toggleChannels;
    chatHeader.prepend(menuBtn);
  }

  function toggleChannels() {
    document.querySelector('.channels').classList.toggle('open');
  }

  // ===== SOBRESCRIBIR cambiarCanal PARA CERRAR MENÚ =====
  const originalCambiarCanal = cambiarCanal;
  cambiarCanal = function(index) {
    originalCambiarCanal(index);
    if (isMobile) {
      document.querySelector('.channels').classList.remove('open');
    }
  };

   // ===== INDICADOR DE ESCRIBIENDO =====
  const input = document.getElementById('bloc-notas');
  const typingIndicator = document.createElement('div');
  typingIndicator.className = 'typing-indicator';
  typingIndicator.textContent = 'Escribiendo...';
  document.querySelector('.messages').appendChild(typingIndicator);

  let typingTimeout;
  input.addEventListener('input', () => {
    typingIndicator.classList.add('active');
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      typingIndicator.classList.remove('active');
    }, 1000);
  });

  // ===== GUARDAR NOTAS EN LOCALSTORAGE =====
  input.addEventListener('input', () => {
    localStorage.setItem('discord-notas', input.value);
  });

  const notasGuardadas = localStorage.getItem('discord-notas');
  if (notasGuardadas) {
    input.value = notasGuardadas;
  }

  // ===== BOTÓN DE AUDIO (ADORNO) =====
  const audioBtn = document.querySelector('.icon-btn');
  audioBtn.addEventListener('click', () => {
    audioBtn.style.color = '#f23f43';
    setTimeout(() => {
      audioBtn.style.color = '#b5bac1';
    }, 300);
  });

  // ===== BOTÓN "+" (ADORNO) =====
  const plusBtn = document.querySelector('.plus');
  plusBtn.addEventListener('click', () => {
    plusBtn.style.transform = 'scale(0.9)';
    setTimeout(() => {
      plusBtn.style.transform = 'scale(1)';
    }, 150);
  });

  // ===== GESTOS TÁCTILES =====
  let touchStartX = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });

  document.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].clientX;
    const diff = touchEndX - touchStartX;

    if (diff > 80) {
      document.querySelector('.channels').classList.add('open');
    }

    if (diff < -80) {
      document.querySelector('.channels').classList.remove('open');
    }
  });

  // ===== ORIENTACIÓN =====
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if (window.matchMedia('(max-width: 768px)').matches) {
        document.querySelector('.channels').classList.remove('open');
      }
    }, 200);
  });

  // ===== PREVENIR ZOOM DOBLE TOQUE =====
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, false);
